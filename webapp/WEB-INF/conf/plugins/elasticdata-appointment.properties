# elasticdata-appointment properties file

#######################################################################################################
# Default Labels for XPage
elasticdata-appointment.pageTitle=elasticdata-appointment
elasticdata-appointment.pagePathLabel=elasticdata-appointment

#######################################################################################################
# AppointmentDataSource config
elasticdata-appointment.appointmentDataSource.id=AppointmentDataSource
elasticdata-appointment.appointmentDataSource.name=Appointment Data Source
elasticdata-appointment.appointmentDataSource.targetIndexName=appointmentdatasource
elasticdata-appointment.appointmentDataSource.mappings={"mappings": {"properties": {"timestamp": {"format": "epoch_millis","type": "date"},"createdTimestamp": {"format": "epoch_millis","type": "date"},"appointmentForm.geoPoint": {"type": "geo_point"}}}}

# AppointmentSlotDataSource config
elasticdata-appointment.appointmentSlotDataSource.id=AppointmentSlotDataSource
elasticdata-appointment.appointmentSlotDataSource.name=Appointment Slot Data Source
elasticdata-appointment.appointmentSlotDataSource.targetIndexName=appointmentslotdatasource
elasticdata-appointment.appointmentSlotDataSource.mappings={"mappings": {"properties": {"timestamp": {"format": "epoch_millis","type": "date"}}}}

# AppointmentHistoryDataSource config
elasticdata-appointment.appointmentHistoryDataSource.id=AppointmentHistoryDataSource
elasticdata-appointment.appointmentHistoryDataSource.name=Appointment Workflow History Data Source
elasticdata-appointment.appointmentHistoryDataSource.targetIndexName=appointmenthistorydatasource
elasticdata-appointment.appointmentHistoryDataSource.mappings={"mappings": {"properties": {"timestamp": {"format": "epoch_millis","type": "date"}}}}
